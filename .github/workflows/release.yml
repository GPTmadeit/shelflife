name: Release

# Push a tag like v0.2.0 (matching scripts/core/version.gd, with a "## 0.2.0"
# section in CHANGELOG.md) to build, test and publish a release. Installed
# copies of the game update themselves from it.
#
# It can also be started by hand (gh workflow run release.yml --ref main):
# that releases the version in version.gd from the chosen commit. A release
# of the same version is replaced, but only if its tag is on that commit:
# tags are never moved, so a new build of new code needs a new version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version, tag and changelog
        id: version
        run: |
          v=$(grep -oP 'VERSION := "\K[^"]+' scripts/core/version.gd)
          p=$(grep -oP '^config/version="\K[^"]+' project.godot)
          [ "$v" = "$p" ] || { echo "::error::version.gd says $v but project.godot says $p"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the game version $v"; exit 1
          fi
          grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
          IFS=. read -r major minor patch <<< "$v"
          code=$(( major * 10000 + minor * 100 + patch ))
          for c in $(grep -oP '^version/code=\K\d+' export_presets.cfg); do
            [ "$c" = "$code" ] || { echo "::error::export_presets.cfg has Android version code $c, not $code (run tools/set_version.sh $v)"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && unzip -q templates.tpz && mv templates/* "$dest"/
          rm -rf godot.zip templates.tpz templates

      # The APKs need Java (for apksigner) and the Android SDK, which the
      # runner has. They're signed with the release key from the repository's
      # secrets: every release has to carry the same key, or phones won't
      # take it as an update.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Godot at the Android SDK and the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHELFLIFE_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::the SHELFLIFE_KEYSTORE_B64 secret is missing"; exit 1; }
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Import the project
        run: godot --headless --path . --import > /dev/null 2>&1 || true

      - name: Check scripts and dialogue
        run: |
          godot --headless --path . --script tests/check.gd 2>&1 | tee check.log
          grep -q "CHECK OK" check.log

      - name: Build the release files
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: shelflife
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.SHELFLIFE_KEYSTORE_PASSWORD }}
        run: |
          tools/package.sh --testkit testkit
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APKs
        run: |
          v=${{ steps.version.outputs.version }}
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for a in arm64 x86_64; do
            "$aapt" dump badging "dist/ShelfLife-android-$a.apk" > badging.txt
            head -1 badging.txt
            grep -q "^package: name='com.gptmadeit.shelflife'.*versionName='$v'" badging.txt || { echo "::error::the $a APK isn't com.gptmadeit.shelflife $v"; exit 1; }
            grep -q "REQUEST_INSTALL_PACKAGES" badging.txt || { echo "::error::the $a APK can't install its own updates"; exit 1; }
          done

      # A thumb on the stick walks, JUMP jumps, a second finger reads on.
      - name: Touch controls drive the game
        run: |
          mkdir -p touch && (cd touch && unzip -q ../dist/ShelfLife-linux-x86_64.zip)
          GAME=touch/ShelfLife.x86_64 tests/touch_test.sh

      # The exported game plays each act by itself (auto-read dialogue, a bot
      # walking right, no fall damage) and has to reach the end card.
      - name: Play Act One start to finish
        run: |
          mkdir play && (cd play && unzip -q ../dist/ShelfLife-linux-x86_64.zip)
          XDG_DATA_HOME="$RUNNER_TEMP/play-data" timeout 1200 play/ShelfLife.x86_64 --headless -- \
            --cp start --auto --bot --godmode --trace --end-quit --quit 1000 > play.log 2>&1 || true
          grep "ACT ONE COMPLETE" play.log || { tail -80 play.log; echo "::error::the playthrough didn't reach the end of Act One"; exit 1; }

      - name: Play Act Two start to finish
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/play-data2" timeout 1200 play/ShelfLife.x86_64 --headless -- \
            --level 2 --cp start --auto --bot --godmode --trace --end-quit --quit 1000 > play2.log 2>&1 || true
          grep "ACT TWO COMPLETE" play2.log || { tail -80 play2.log; echo "::error::the playthrough didn't reach the end of Act Two"; exit 1; }
          cat play2.log >> play.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-log
          path: play.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: testkit
          path: testkit

  # A fresh 0.0.0 install updates itself to this build from a local server,
  # restarts and must come back as the new version, on Linux and on Windows,
  # both for the usual game-file update and for a full engine + game update.
  update-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        mode: [pck, zip]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: testkit
          path: testkit
      - name: Update from 0.0.0 (${{ matrix.mode }})
        run: tools/update_test.sh ${{ runner.os == 'Windows' && 'windows' || 'linux' }} dist testkit ${{ matrix.mode }}

  # The same on Android: a 0.0.0 APK finds this build on a local server,
  # downloads it and hands it to Android's installer, whose Update button the
  # test presses. The phone has to end up with this build's exact APK.
  android-update-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: testkit
          path: testkit
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update from 0.0.0 on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: tools/android_update_test.sh dist testkit

  publish:
    needs: [build, update-test, android-update-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Write the release notes
        run: python3 tools/release_notes.py "$VERSION" > notes.md && cat notes.md
      - name: Publish the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            at=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
            [ "$at" = "$GITHUB_SHA" ] || { echo "::error::$TAG is already on $at; bump the version (tools/set_version.sh) to release new code"; exit 1; }
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Shelf Life $TAG" --notes-file notes.md --latest

  # The same update, from the real release on GitHub this time.
  verify-release:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TAG: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testkit
          path: testkit
      - name: Update from 0.0.0 using the published release
        run: |
          plat=${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p manifest.json -p "ShelfLife-$plat-x86_64.zip" -D published
          tools/update_test.sh "$plat" published testkit github
      - name: The published APKs are the ones the manifest names
        if: runner.os == 'Linux'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'ShelfLife-android-*.apk' -D published
          for a in arm64 x86_64; do
            want=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["platforms"]["android-" + sys.argv[2]]["apk"]["sha256"])' published/manifest.json "$a")
            got=$(sha256sum "published/ShelfLife-android-$a.apk" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::the published $a APK doesn't match manifest.json"; exit 1; }
            echo "android-$a: $got"
          done
